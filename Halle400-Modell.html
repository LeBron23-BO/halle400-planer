<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Halle 400 — Büro, Axonometrie</title>
<style>
  :root{
    --paper:#F2ECDE; --paper-deep:#DED5C0; --ink:#1E2A25; --ink-dim:#46514A;
    --ink-mute:#6B7570; --hair-strong:#BAB09C; --amber:#C8703A; --sage-deep:#3F6757;
    --panel:rgba(242,236,222,.92); --panel-line:#C9C0AA;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    --sans:"Avenir Next","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
    --mono:"Roboto Mono","Cascadia Mono",Consolas,"SF Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
       -webkit-font-smoothing:antialiased;overflow:hidden}
  #buehne{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
  canvas.zieht{cursor:grabbing}
  .kopf{position:fixed;top:0;left:0;padding:22px 26px;pointer-events:none;max-width:min(46ch,72vw)}
  .kopf h1{font-family:var(--serif);font-weight:600;font-size:clamp(19px,2.5vw,27px);
       margin:0 0 3px;line-height:1.15}
  .kopf .sub{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;
       text-transform:uppercase;color:var(--ink-mute);line-height:1.7}
  .strich{height:1px;background:var(--hair-strong);margin:9px 0 8px;max-width:270px}
  .leiste{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);
       display:flex;flex-wrap:wrap;justify-content:center;gap:5px;padding:6px;
       background:var(--panel);border:1px solid var(--panel-line);
       backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
       max-width:calc(100vw - 24px);z-index:5}
  .grp{display:flex;gap:2px;align-items:center}
  .grp + .grp{border-left:1px solid var(--panel-line);padding-left:5px;margin-left:2px}
  button{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
       color:var(--ink-dim);background:transparent;border:1px solid transparent;
       padding:9px 11px;min-height:38px;cursor:pointer;white-space:nowrap;
       transition:background .15s,color .15s,border-color .15s}
  button:hover{background:var(--paper-deep);color:var(--ink)}
  button[aria-pressed="true"]{color:var(--paper);background:var(--sage-deep);border-color:var(--sage-deep)}
  button:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
  .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
       color:var(--ink-mute);padding:0 7px 0 3px;user-select:none}
  .tafel{position:fixed;top:20px;right:20px;width:270px;max-height:calc(100vh - 140px);
       background:var(--panel);border:1px solid var(--panel-line);
       backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
       display:flex;flex-direction:column;z-index:6;transition:transform .28s ease,opacity .28s ease}
  .tafel.weg{transform:translateX(calc(100% + 24px));opacity:0}
  .tafel-kopf{display:flex;align-items:baseline;justify-content:space-between;gap:8px;
       padding:13px 14px 9px;border-bottom:1px solid var(--panel-line)}
  .tafel-kopf b{font-family:var(--mono);font-size:10px;letter-spacing:.15em;
       text-transform:uppercase;font-weight:500;color:var(--ink-dim)}
  .tafel-kopf span{font-family:var(--mono);font-size:10px;color:var(--ink-mute);
       font-variant-numeric:tabular-nums}
  .tafel-leib{overflow-y:auto;padding:4px 0 8px}
  .zeile{display:grid;grid-template-columns:26px 1fr;gap:9px;padding:8px 14px;
       align-items:start;border-left:2px solid transparent}
  .zeile.an{border-left-color:var(--amber);background:rgba(200,112,58,.09)}
  .zeile .n{font-family:var(--mono);font-size:10px;color:var(--ink-mute);
       padding-top:2px;font-variant-numeric:tabular-nums}
  .zeile.an .n{color:var(--amber)}
  .zeile .nm{font-family:var(--serif);font-size:15px;line-height:1.25;color:var(--ink)}
  .zeile .rm{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
       color:var(--amber);margin-top:3px;line-height:1.5}
  .zeile .src{font-size:11.5px;color:var(--ink-mute);margin-top:2px;line-height:1.4}
  .tafel-fuss{padding:9px 14px 11px;border-top:1px solid var(--panel-line);
       font-size:11px;line-height:1.5;color:var(--ink-mute)}
  .hinweis{position:fixed;left:26px;bottom:18px;max-width:44ch;font-family:var(--mono);
       font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-mute);
       pointer-events:none;opacity:.85;line-height:1.7}
  @media (max-width:900px){
    .tafel{top:auto;bottom:112px;right:10px;left:10px;width:auto;max-height:38vh}
    .hinweis{display:none}
    .kopf{padding:12px 14px;max-width:none}
    .kopf .sub{font-size:9px;letter-spacing:.11em;line-height:1.6}
    .strich{margin:7px 0 6px;max-width:180px}
    .leiste{bottom:10px;padding:5px;gap:4px}
    button{padding:8px 9px;font-size:10px}
    .lbl{padding:0 4px 0 2px;font-size:9px}
  }
  @media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>

<div id="buehne"><canvas id="c"></canvas></div>

<header class="kopf">
  <h1>Halle&nbsp;400 &middot; Büro</h1>
  <div class="strich"></div>
  <div class="sub" id="unterzeile">Axonometrie</div>
</header>

<aside class="tafel" id="tafel">
  <div class="tafel-kopf"><b>Die neun Säulen</b><span id="zaehler"></span></div>
  <div class="tafel-leib" id="tafelLeib"></div>
  <div class="tafel-fuss" id="tafelFuss"></div>
</aside>

<div class="leiste" role="toolbar" aria-label="Ansicht steuern">
  <div class="grp">
    <span class="lbl">Blick</span>
    <button type="button" data-blick="0">Nord</button>
    <button type="button" data-blick="1">West</button>
    <button type="button" data-blick="2">Süd</button>
    <button type="button" data-blick="3">Plan</button>
  </div>
  <div class="grp">
    <span class="lbl">Namen</span>
    <button type="button" data-namen="alle">Alle</button>
    <button type="button" data-namen="saeulen">Säulen</button>
    <button type="button" data-namen="aus">Aus</button>
  </div>
  <div class="grp">
    <button type="button" id="btnAusbau" aria-pressed="false">9&nbsp;Säulen</button>
    <button type="button" id="btnTafel" aria-pressed="true">Legende</button>
  </div>
</div>

<div class="hinweis">
  Ziehen dreht &middot; Rad zoomt &middot; zwei Finger zoomen<br>
  Grundriss und Ausstattung sind gemessen. Höhen sind gesetzte Annahmen —
  ein Grundriss enthält keine.
</div>

/* ══════ axo-zyklen.js ══════ */
/**
 * RAUMFLAECHEN AUS WAENDEN ABLEITEN (X2)
 * ======================================
 *
 * Die Vorlage `app/public/uebersicht.html` hatte ihre 23 Raeume als Rechtecke
 * vorliegen (`ROOMS`, uebersicht.html:188). Der Planer hat sie nicht: er fuehrt
 * 76 Ecken und 100 Waende, die Flaechen dazwischen sind die kleinsten Zyklen im
 * Wandgraphen. Diese Datei leitet sie ab.
 *
 * WARUM NICHT `floorplan.getRooms()` DIREKT
 * Die Axonometrie hat ZWEI Auslieferungen: die dritte Ansicht im Planer (dort
 * gaebe es `getRooms()`) und die Bank-Datei `Halle400-Modell.html`, die von
 * `tools/baue-bank-ansicht.mjs` ohne Browser und ohne TypeScript gebaut wird
 * (dort gibt es sie nicht). Wuerde jede Seite ihre eigene Quelle benutzen,
 * koennten Planer und Bank verschiedene Raeume zeigen — und niemand merkte es.
 * Beide benutzen darum DIESE Ableitung, und `tools/pruefe-axonometrie.mjs`
 * misst sie gegen `floorplan.getRooms()` im echten Planer. Weicht sie ab, wird
 * das Gate rot; die Gleichheit ist damit bewiesen statt behauptet.
 *
 * Der Algorithmus ist der des Planers (`src/model/floorplan.ts:580`), auf
 * schlichte Punkte statt auf Corner-Objekte umgestellt.
 */

/** Winkel zwischen zwei Richtungen, auf 0..2pi gehoben. [utils.ts:100] */
function winkel2pi(x1, y1, x2, y2) {
  const punkt = x1 * x2 + y1 * y2
  const kreuz = x1 * y2 - y1 * x2
  const w = -Math.atan2(kreuz, punkt)
  return w < 0 ? w + 2 * Math.PI : w
}

/**
 * Laeuft ein Vieleck im Uhrzeigersinn?             [utils.ts:112]
 * Die Vorlage verschiebt die Punkte vorher ins Positive. Das ist wirkungslos
 * (die Summe ist bei geschlossenem Zug translationsinvariant: der zusaetzliche
 * Term ist 2b mal der Summe aller dx, und die ist null) — hier weggelassen,
 * das Ergebnis bleibt identisch.
 */
function imUhrzeigersinn(punkte) {
  let summe = 0
  for (let i = 0; i < punkte.length; i++) {
    const a = punkte[i]
    const b = punkte[i === punkte.length - 1 ? 0 : i + 1]
    summe += (b.x - a.x) * (b.y + a.y)
  }
  return summe >= 0
}

/** Flaeche eines Vielecks (gleiche Einheit wie die Punkte, quadriert). */
function flaecheVon(punkte) {
  let a = 0
  for (let i = 0; i < punkte.length; i++) {
    const p = punkte[i]
    const q = punkte[(i + 1) % punkte.length]
    a += p.x * q.y - q.x * p.y
  }
  return Math.abs(a) / 2
}

/** Schwerpunkt eines Vielecks. */
function mitteVon(punkte) {
  let x = 0
  let y = 0
  for (const p of punkte) {
    x += p.x
    y += p.y
  }
  return { x: x / punkte.length, y: y / punkte.length }
}

/** Liegt ein Punkt im Vieleck? (Strahlenverfahren) */
function liegtIn(pt, punkte) {
  let drin = false
  for (let i = 0, j = punkte.length - 1; i < punkte.length; j = i++) {
    const a = punkte[i]
    const b = punkte[j]
    if (a.y > pt.y !== b.y > pt.y && pt.x < ((b.x - a.x) * (pt.y - a.y)) / (b.y - a.y) + a.x) {
      drin = !drin
    }
  }
  return drin
}

/**
 * Engster Zyklus, der von `erste` ueber `zweite` zurueckfuehrt.
 * Bei jeder Verzweigung wird die Kante mit dem kleinsten Innenwinkel zuerst
 * genommen — so entsteht die kleinstmoegliche Masche statt einer Runde um das
 * halbe Gebaeude.
 */
function engsterZyklus(erste, zweite, nachbarnVon) {
  const stapel = []
  let naechster = { ecke: zweite, bisher: [erste] }
  const gesehen = { [erste.id]: true }

  while (naechster) {
    const jetzt = naechster.ecke
    gesehen[jetzt.id] = true

    if (jetzt === erste && jetzt !== zweite) return naechster.bisher

    const anhaengen = []
    for (const nachbar of nachbarnVon(jetzt)) {
      const zurueck = nachbar.id in gesehen && !(nachbar === erste && jetzt !== zweite)
      if (!zurueck) anhaengen.push(nachbar)
    }

    const bisher = naechster.bisher.slice()
    bisher.push(jetzt)

    if (anhaengen.length > 1) {
      const vorher = naechster.bisher[naechster.bisher.length - 1]
      anhaengen.sort(
        (a, b) =>
          winkel2pi(vorher.x - jetzt.x, vorher.y - jetzt.y, b.x - jetzt.x, b.y - jetzt.y) -
          winkel2pi(vorher.x - jetzt.x, vorher.y - jetzt.y, a.x - jetzt.x, a.y - jetzt.y)
      )
    }
    for (const e of anhaengen) stapel.push({ ecke: e, bisher })

    naechster = stapel.pop()
  }
  return []
}

/**
 * Alle Raumflaechen eines Grundrisses.
 *
 * @param {Record<string,{x:number,y:number}>} corners Ecken nach Kennung, in cm
 * @param {{corner1:string,corner2:string}[]} walls Waende als Eckenpaare
 * @returns {{x:number,y:number,id:string}[][]} Vielecke gegen den Uhrzeigersinn
 */
function leiteRaeumeAb(corners, walls) {
  const ecken = new Map()
  for (const id of Object.keys(corners)) {
    ecken.set(id, { id, x: corners[id].x, y: corners[id].y })
  }

  // Nachbarschaft in der Reihenfolge des Planers aufbauen: erst die Waende, die
  // an dieser Ecke BEGINNEN, dann die, die hier ENDEN (corner.ts:168). Die
  // Reihenfolge entscheidet bei gleichen Winkeln, welcher Zyklus zuerst
  // gefunden wird — sie muss darum uebereinstimmen.
  const beginnt = new Map()
  const endet = new Map()
  for (const w of walls) {
    if (!ecken.has(w.corner1) || !ecken.has(w.corner2)) continue
    if (!beginnt.has(w.corner1)) beginnt.set(w.corner1, [])
    if (!endet.has(w.corner2)) endet.set(w.corner2, [])
    beginnt.get(w.corner1).push(ecken.get(w.corner2))
    endet.get(w.corner2).push(ecken.get(w.corner1))
  }
  const nachbarnVon = (e) => [...(beginnt.get(e.id) || []), ...(endet.get(e.id) || [])]

  const maschen = []
  for (const ecke of ecken.values()) {
    for (const nachbar of nachbarnVon(ecke)) {
      maschen.push(engsterZyklus(ecke, nachbar, nachbarnVon))
    }
  }

  // Doppelte entfernen: ein Zyklus bleibt derselbe, wie weit man ihn auch
  // durchrotiert — darum jede Drehung gegen das Verzeichnis pruefen.
  const gesehen = new Set()
  const einmalig = []
  for (const masche of maschen) {
    if (!masche.length) continue
    let neu = true
    const schluessel = []
    for (let j = 0; j < masche.length; j++) {
      const gedreht = masche.slice(j).concat(masche.slice(0, j))
      const s = gedreht.map((c) => c.id).join('-')
      schluessel.push(s)
      if (gesehen.has(s)) neu = false
    }
    if (neu) {
      einmalig.push(masche)
      schluessel.forEach((s) => gesehen.add(s))
    }
  }

  // Im Uhrzeigersinn laufende Maschen sind die Aussenseite derselben Flaeche.
  return einmalig.filter((m) => !imUhrzeigersinn(m))
}

/* ══════ axo-szene.js ══════ */
/**
 * SZENE AUS DEN ECHTEN PLANDATEN (X2)
 * ===================================
 *
 * Wandelt den gemessenen Grundriss in Koerper um, die `axo-zeichnen.js` malen
 * kann. Die Vorlage erzeugte ihre Moebel prozedural pro Raumtyp
 * (`furnish`, uebersicht.html:292) — hier wird stattdessen JEDES der 289
 * gemessenen Ausstattungs-Elemente einzeln gezeichnet. Das ist der ganze
 * Unterschied zwischen einem huebschen Schema und dem Grundriss dieser Halle.
 *
 * EIN EINZIGES PRIMITIV
 * Alles ist ein Prisma: ein Vieleck in der Grundflaeche, senkrecht ausgezogen
 * von `y0` bis `y1`. Ein Kasten ist der Sonderfall mit vier Ecken, ein runder
 * Tisch der mit zwoelf. Die Vorlage kannte nur Kaesten (uebersicht.html:230)
 * und konnte darum weder Raumflaechen mit sechs Ecken noch runde Moebel
 * zeigen; beides kommt in diesem Plan vor.
 *
 * KOORDINATEN
 * Der Planer misst in Zentimetern auf einer Draufsicht (x nach Osten, y nach
 * Sueden). Der Renderer rechnet in Metern mit y als HOEHE. Die Grundflaeche
 * heisst hier darum (x, z) — `z` ist das `y` des Planers.
 */




/** @typedef {{x:number,z:number}} Punkt */
/** @typedef {{punkte:Punkt[], y0:number, y1:number, material:string, normale?:number[], istBoden?:boolean}} Koerper */

/** Rechteck um einen Mittelpunkt, gedreht. Masse in Metern. */
function rechteck(cx, cz, breite, tiefe, drehung) {
  const c = Math.cos(drehung || 0)
  const s = Math.sin(drehung || 0)
  const hb = breite / 2
  const ht = tiefe / 2
  return [
    [-hb, -ht],
    [hb, -ht],
    [hb, ht],
    [-hb, ht]
  ].map(([dx, dz]) => ({ x: cx + dx * c - dz * s, z: cz + dx * s + dz * c }))
}

/** Vieleck als Ersatz fuer einen Kreis/eine Ellipse. */
function rund(cx, cz, breite, tiefe, ecken = 12) {
  const p = []
  for (let i = 0; i < ecken; i++) {
    const a = (i / ecken) * Math.PI * 2
    p.push({ x: cx + (Math.cos(a) * breite) / 2, z: cz + (Math.sin(a) * tiefe) / 2 })
  }
  return p
}

/**
 * Eine Wand als liegendes Rechteck entlang ihrer Achse — in Stuecke von
 * hoechstens `DARSTELLUNG.kachel` zerlegt. Ohne diese Zerlegung bekaeme die
 * 78 m lange Nordwand EINEN Tiefenwert (den ihrer Mitte) und verdeckte alles,
 * was hinter diesem Punkt liegt (uebersicht.html:412).
 */
function wandStuecke(a, b, dicke, y1, material, normale) {
  const laenge = Math.hypot(b.x - a.x, b.z - a.z)
  if (laenge < 1e-6) return []
  const n = Math.max(1, Math.ceil(laenge / DARSTELLUNG.kachel))
  const ex = (b.x - a.x) / laenge
  const ez = (b.z - a.z) / laenge
  const px = (-ez * dicke) / 2
  const pz = (ex * dicke) / 2
  const stuecke = []
  for (let i = 0; i < n; i++) {
    const t0 = (laenge * i) / n
    const t1 = (laenge * (i + 1)) / n
    const p0 = { x: a.x + ex * t0, z: a.z + ez * t0 }
    const p1 = { x: a.x + ex * t1, z: a.z + ez * t1 }
    stuecke.push({
      punkte: [
        { x: p0.x + px, z: p0.z + pz },
        { x: p1.x + px, z: p1.z + pz },
        { x: p1.x - px, z: p1.z - pz },
        { x: p0.x - px, z: p0.z - pz }
      ],
      y0: 0,
      y1,
      material,
      normale
    })
  }
  return stuecke
}

/**
 * Koerper eines Ausstattungs-Elements — EIN Koerper je gemessenem Element.
 *
 * Der erste Entwurf setzte Stuehle aus Sitz und Lehne zusammen, liess Treppen
 * in neun Stufen ansteigen und machte aus manchen Rundtischen Sessel. Alles
 * davon ist wieder verschwunden: der Plan misst Umriss und Standort, nicht
 * Form. Was ein Element hoch ist, sagt die Tabelle des Projekts; wie es
 * aussieht, sagt sein Umriss. Mehr steht nicht fest, also wird mehr nicht
 * gezeigt.
 *
 * @param {object} el Element aus `floorplan.ausstattung`, Masse in cm
 * @param {{oberkante:object, koerper:object}} hoehen
 */
function ausstattungsKoerper(el, hoehen) {
  const form = bauformFuer(el, hoehen)
  if (!form) return [] // unbekannter Typ: lieber nichts als etwas Erfundenes
  const cx = el.x * CM
  const cz = el.y * CM
  const b = el.breite * CM
  const t = el.tiefe * CM
  const dr = el.drehung || 0
  return [
    {
      punkte: form.rund ? rund(cx, cz, b, t) : rechteck(cx, cz, b, t, dr),
      y0: form.y0,
      y1: form.y1,
      material: form.material
    }
  ]
}

/**
 * Baut die vollstaendige Szene.
 *
 * @param {{floorplan:{corners:object,walls:object[],ausstattung?:object[]},labels?:object[]}} plan
 * @param {{wandDicke?:number, nurKernSaeulen?:boolean, hoehen?:object}} [opt]
 *        `wandDicke` in cm; `hoehen` sind OBERKANTE_CM/KOERPER_CM aus
 *        `src/three/ausstattung.ts` — ohne sie wird keine Ausstattung
 *        gezeichnet, denn dann ist keine Hoehe belegt.
 */
function baueSzene(plan, opt = {}) {
  const fp = plan.floorplan || plan
  const dicke = (opt.wandDicke ?? 12.5) * CM
  const labels = plan.labels || []

  /* ── Raumflaechen ──────────────────────────────────────────────── */
  const zyklen = leiteRaeumeAb(fp.corners, fp.walls)
  const raeume = zyklen.map((z) => {
    const punkte = z.map((c) => ({ x: c.x * CM, z: c.y * CM }))
    return { punkte, ecken: z.length, flaeche: flaecheVon(z) * CM * CM, mitte: mitteVon(punkte) }
  })

  // Die Erschliessungszone ist der Zyklus, der zwischen allen Raeumen
  // maeandert — im gemessenen Plan 46 Ecken gegenueber 4 bei jedem Raum. Sie
  // schluckt zugleich die offenen Arbeitsbereiche, die keine geschlossenen
  // Waende haben; darum tragen 6 der 18 Namens-Anker in ihr. Das ist kein
  // Fehler der Ableitung, sondern die Wahrheit dieses Grundrisses.
  let flurIndex = -1
  let meisteEcken = 8
  raeume.forEach((r, i) => {
    if (r.ecken > meisteEcken) {
      meisteEcken = r.ecken
      flurIndex = i
    }
  })

  /* ── Namens-Anker und ihre Saeulen ─────────────────────────────── */
  const zaehler = {}
  const marken = labels.map((l) => {
    const schluessel = `${l.text}|${l.seite}`
    const rang = (zaehler[schluessel] = (zaehler[schluessel] ?? -1) + 1)
    const s = saeuleFuer(l, rang)
    const aktiv = s && (!s.nurVollausbau || !opt.nurKernSaeulen)
    return {
      text: l.text,
      zusatz: l.zusatz || '',
      seite: l.seite,
      x: l.anker_cm[0] * CM,
      z: l.anker_cm[1] * CM,
      saeule: s ? s.saeule : null,
      nurVollausbau: s ? s.nurVollausbau : false,
      hervor: !!aktiv
    }
  })

  // Raum -> Saeule, damit der Boden eines Saeulen-Raums seinen eigenen Ton
  // bekommt (uebersicht.html:459 `floorP`).
  const saeulenRaeume = new Set()
  marken.forEach((m) => {
    if (!m.hervor) return
    raeume.forEach((r, i) => {
      if (i !== flurIndex && liegtIn({ x: m.x, y: m.z }, r.punkte.map((p) => ({ x: p.x, y: p.z })))) {
        saeulenRaeume.add(i)
      }
    })
  })

  /* ── Koerper: Boeden, Waende, Ausstattung ──────────────────────── */
  const boeden = raeume.map((r, i) => ({
    punkte: r.punkte,
    y0: 0,
    y1: DARSTELLUNGSHOEHE.boden,
    material: i === flurIndex ? 'flur' : saeulenRaeume.has(i) ? 'bodenSaeule' : r.flaeche < 20 ? 'bodenNeben' : 'boden',
    istBoden: true
  }))

  /**
   * Aussenwand oder Innenwand? Topologisch entschieden statt aus dem Feld
   * `art` des Plans gelesen: eine Wand ist aussen, wenn auf EINER ihrer beiden
   * Seiten keine Raumflaeche mehr liegt.
   *
   * Der Umweg ist noetig und zugleich besser. Noetig, weil `art` nur in der
   * Plan-Datei steht — das Wandmodell des Planers fuehrt es nicht, nach dem
   * Laden waere es weg, und die Ansicht im Planer haette gar keine Aussenwaende
   * mehr. Besser, weil eine Wand, die der Nutzer gerade erst gezeichnet hat,
   * ueberhaupt kein `art` haben KANN — die Geometrie dagegen ist immer da.
   *
   * Nebenbei faellt die Aussennormale ab, und zwar die richtige: sie zeigt zur
   * leeren Seite. Die vorherige Annahme "zeigt von der Hallenmitte weg" haette
   * am Aufzug-Vorbau (y-min −352 cm) ins Gebaeudeinnere gezeigt.
   */
  const alsPolygone = raeume.map((r) => r.punkte.map((p) => ({ x: p.x, y: p.z })))
  const inIrgendeinemRaum = (x, z) => alsPolygone.some((poly) => liegtIn({ x, y: z }, poly))
  const tastAbstand = Math.max(dicke, 0.1) * 1.6

  const waende = []
  for (const w of fp.walls) {
    const a = fp.corners[w.corner1]
    const b = fp.corners[w.corner2]
    if (!a || !b) continue
    const pa = { x: a.x * CM, z: a.y * CM }
    const pb = { x: b.x * CM, z: b.y * CM }
    const ex = pb.x - pa.x
    const ez = pb.z - pa.z
    const laenge = Math.hypot(ex, ez) || 1
    const nx = -ez / laenge
    const nz = ex / laenge
    const mx = (pa.x + pb.x) / 2
    const mz = (pa.z + pb.z) / 2
    const linksDrin = inIrgendeinemRaum(mx + nx * tastAbstand, mz + nz * tastAbstand)
    const rechtsDrin = inIrgendeinemRaum(mx - nx * tastAbstand, mz - nz * tastAbstand)

    let normale
    if (linksDrin !== rechtsDrin) {
      // Genau eine Seite ist leer — dorthin zeigt die Aussennormale.
      normale = linksDrin ? [-nx, 0, -nz] : [nx, 0, nz]
    }
    // Steht die Wand voellig frei (beide Seiten leer), bleibt sie stehen: sie
    // wegzuschneiden liesse ein Stueck Grundriss verschwinden, das es gibt.
    const aussen = !!normale
    waende.push(
      ...wandStuecke(
        pa,
        pb,
        dicke,
        aussen ? DARSTELLUNGSHOEHE.wandAussen : DARSTELLUNGSHOEHE.wandInnen,
        aussen ? 'wandAussen' : 'wand',
        normale
      )
    )
  }

  const hoehen = opt.hoehen || { oberkante: {}, koerper: {} }
  const moebel = []
  for (const el of fp.ausstattung || []) moebel.push(...ausstattungsKoerper(el, hoehen))

  /* ── Ausdehnung fuer den Massstab ──────────────────────────────── */
  let x0 = Infinity
  let x1 = -Infinity
  let z0 = Infinity
  let z1 = -Infinity
  for (const id of Object.keys(fp.corners)) {
    const c = fp.corners[id]
    x0 = Math.min(x0, c.x * CM)
    x1 = Math.max(x1, c.x * CM)
    z0 = Math.min(z0, c.y * CM)
    z1 = Math.max(z1, c.y * CM)
  }

  return {
    boeden,
    waende,
    moebel,
    marken,
    raeume,
    flurIndex,
    grenzen: { x0, x1, z0, z1 },
    mitte: { x: (x0 + x1) / 2, z: (z0 + z1) / 2 },
    hoechster: DARSTELLUNGSHOEHE.kern
  }
}

/* ══════ axo-zeichnen.js ══════ */
/**
 * AXONOMETRIE — RENDERER (X2)
 * ===========================
 *
 * Malt eine Szene aus `axo-szene.js` auf ein Canvas-2D. Kein three.js, kein
 * SVG, keine fremde Bibliothek — genau wie die Vorlage `uebersicht.html`. Das
 * ist der Grund, warum die Bank-Datei damit von 2,0 MB auf einen Bruchteil
 * faellt: die 2 MB waren three.js.
 *
 * Der Renderer kennt nur das Canvas. Blattkopf, Saeulen-Tafel und
 * Bedienleiste sind DOM und gehoeren der jeweiligen Huelle — im Planer der
 * React-Ansicht, in der Bank-Datei dem erzeugten HTML. So bleibt EIN Renderer
 * fuer beide Auslieferungen.
 */



/** Flaechenhelligkeit aus dem Winkel zum Streiflicht. [uebersicht.html:560] */
function toenen(hex, n) {
  const d = LICHT[0] * n[0] + LICHT[1] * n[1] + LICHT[2] * n[2]
  const k = SCHATTEN.grund + SCHATTEN.streif * Math.max(0, d)
  const h = hex.replace('#', '')
  const r = parseInt(h.slice(0, 2), 16)
  const g = parseInt(h.slice(2, 4), 16)
  const b = parseInt(h.slice(4, 6), 16)
  const c = (v) => Math.max(0, Math.min(255, Math.round(v * k)))
  return `rgb(${c(r)},${c(g)},${c(b)})`
}

/**
 * Erzeugt eine Axonometrie auf dem uebergebenen Canvas.
 *
 * @param {HTMLCanvasElement} canvas
 * @param {object} szene Ergebnis von `baueSzene`
 * @param {{dunkel?:boolean, namen?:'alle'|'saeulen'|'aus', randRechts?:number, randOben?:number}} [opt]
 */
function erzeugeAxonometrie(canvas, szene, opt = {}) {
  const ctx = canvas.getContext('2d')
  const blick = { ...BLICK_START, schiebX: 0, schiebY: 0 }
  let breite = 0
  let hoehe = 0
  let dunkel = !!opt.dunkel
  let namenModus = opt.namen || 'alle'
  let randRechts = opt.randRechts || 0
  let schnell = false
  let farben = dunkel ? PALETTE.dunkel : PALETTE.hell

  // Projektionsgroessen, bei jedem Bild neu gesetzt
  let sinA = 0
  let cosA = 0
  let sinE = 0
  let cosE = 0
  let massstab = 1
  let ox = 0
  let oy = 0
  let silhouette = { y0: 0, y1: 0 }

  const mitteY = 0.6 // Drehachse auf halber Schnitthoehe [uebersicht.html:546]

  function projiziere(x, y, z) {
    const dx = x - szene.mitte.x
    const dz = z - szene.mitte.z
    const dy = y - mitteY
    const xr = dx * cosA - dz * sinA
    const zr = dx * sinA + dz * cosA
    return {
      x: ox + xr * massstab,
      y: oy + (zr * sinE - dy * cosE) * massstab,
      p: zr * cosE + dy * sinE
    }
  }

  function kameraRichtung() {
    return [cosE * sinA, sinE, cosE * cosA]
  }

  /** Massstab so, dass der ganze Baukoerper ins Bild passt — bei jeder Drehung. */
  function setzeKamera() {
    sinA = Math.sin(blick.az)
    cosA = Math.cos(blick.az)
    sinE = Math.sin(blick.el)
    cosE = Math.cos(blick.el)
    massstab = 1
    ox = 0
    oy = 0
    const g = szene.grenzen
    let ux0 = Infinity
    let ux1 = -Infinity
    let uy0 = Infinity
    let uy1 = -Infinity
    for (let i = 0; i < 8; i++) {
      const p = projiziere(i & 1 ? g.x1 : g.x0, i & 2 ? szene.hoechster : 0, i & 4 ? g.z1 : g.z0)
      ux0 = Math.min(ux0, p.x)
      ux1 = Math.max(ux1, p.x)
      uy0 = Math.min(uy0, p.y)
      uy1 = Math.max(uy1, p.y)
    }
    const weit = breite > 900
    const randX = weit ? 62 : 16
    const reihen = namenModus === 'saeulen' ? BESCHRIFTUNG.reihenSaeulen : BESCHRIFTUNG.reihenVoll
    const abstand = weit ? BESCHRIFTUNG.reiheBreit : BESCHRIFTUNG.reiheSchmal
    const randOben = namenModus === 'aus' ? 70 : weit ? 150 : 52 + reihen * abstand
    const randUnten = namenModus === 'aus' ? 96 : weit ? 168 : 86 + reihen * abstand
    const platzB = Math.max(120, breite - 2 * randX - (weit ? randRechts : 0))
    const platzH = Math.max(120, hoehe - randOben - randUnten)
    const grund = Math.min(platzB / Math.max(0.001, ux1 - ux0), platzH / Math.max(0.001, uy1 - uy0))
    massstab = grund * blick.zoom
    const cxp = ((ux0 + ux1) / 2) * massstab
    const cyp = ((uy0 + uy1) / 2) * massstab
    ox = (weit ? (breite - randRechts) / 2 : breite / 2) - cxp + blick.schiebX
    oy = randOben + (hoehe - randOben - randUnten) / 2 - cyp + blick.schiebY
    silhouette = { y0: uy0 * massstab + oy, y1: uy1 * massstab + oy }
  }

  /**
   * Zerlegt ein Prisma in sichtbare Flaechen: den Deckel und die Seiten, die
   * der Kamera zugewandt sind. Der Boden entfaellt — er ist nie zu sehen.
   */
  function flaechenVon(k, richtung, raus) {
    // Puppenhaus-Schnitt: die kameraseitige Aussenwand faellt weg und gibt den
    // Blick in die Raeume frei.                       [uebersicht.html:573]
    if (k.normale) {
      const d = k.normale[0] * richtung[0] + k.normale[1] * richtung[1] + k.normale[2] * richtung[2]
      if (d > DARSTELLUNG.schnittSchwelle) return
    }
    const farbe = farben[k.material] || farben.wand
    const p = k.punkte
    const n = p.length

    // Deckel
    const oben = p.map((q) => projiziere(q.x, k.y1, q.z))
    if (richtung[1] > 0.001) {
      let tiefe = 0
      for (const q of oben) tiefe += q.p
      raus.push({ pts: oben, col: toenen(farbe, [0, 1, 0]), depth: tiefe / n })
    }

    if (k.istBoden) return // Boeden sind flach; ihre Kanten lohnen nicht

    // Seitenflaechen
    let sx = 0
    let sz = 0
    for (const q of p) {
      sx += q.x
      sz += q.z
    }
    sx /= n
    sz /= n
    for (let i = 0; i < n; i++) {
      const a = p[i]
      const b = p[(i + 1) % n]
      const ex = b.x - a.x
      const ez = b.z - a.z
      const len = Math.hypot(ex, ez) || 1
      let nx = ez / len
      let nz = -ex / len
      // Normale nach aussen drehen: sie muss vom Schwerpunkt wegzeigen.
      if (nx * ((a.x + b.x) / 2 - sx) + nz * ((a.z + b.z) / 2 - sz) < 0) {
        nx = -nx
        nz = -nz
      }
      if (nx * richtung[0] + nz * richtung[2] <= 0.001) continue
      const q = [
        projiziere(a.x, k.y1, a.z),
        projiziere(b.x, k.y1, b.z),
        projiziere(b.x, k.y0, b.z),
        projiziere(a.x, k.y0, a.z)
      ]
      raus.push({ pts: q, col: toenen(farbe, [nx, 0, nz]), depth: (q[0].p + q[1].p + q[2].p + q[3].p) / 4 })
    }
  }

  function maleFlaechen(liste) {
    const kanten = massstab > DARSTELLUNG.kanteAbMassstab
    ctx.lineJoin = 'round'
    for (const f of liste) {
      const p = f.pts
      ctx.beginPath()
      ctx.moveTo(p[0].x, p[0].y)
      for (let i = 1; i < p.length; i++) ctx.lineTo(p[i].x, p[i].y)
      ctx.closePath()
      ctx.fillStyle = f.col
      ctx.fill()
      if (kanten) {
        ctx.strokeStyle = farben.tinte
        ctx.globalAlpha = DARSTELLUNG.kanteDeckkraft
        ctx.lineWidth = DARSTELLUNG.kanteBreite
        ctx.stroke()
        ctx.globalAlpha = 1
      }
    }
  }

  /**
   * Beschriftung mit Fuehrungslinien, wie auf dem Originalblatt.
   * Die Etiketten stehen AUSSERHALB des Baukoerpers, weichen einander in bis
   * zu drei Reihen aus und greifen mit einer geknickten Linie zum Anker.
   *                                                  [uebersicht.html:648]
   */
  function maleNamen() {
    let liste = szene.marken
    if (namenModus === 'saeulen') liste = liste.filter((m) => m.hervor)
    if (!liste.length) return

    const weit = breite > 900
    const fs = weit ? BESCHRIFTUNG.schriftBreit : BESCHRIFTUNG.schriftSchmal
    const ss = weit ? BESCHRIFTUNG.zusatzBreit : BESCHRIFTUNG.zusatzSchmal
    const abstand = weit ? BESCHRIFTUNG.reiheBreit : BESCHRIFTUNG.reiheSchmal
    const anzahl = namenModus === 'saeulen' ? BESCHRIFTUNG.reihenSaeulen : BESCHRIFTUNG.reihenVoll
    const maxX = breite - (weit ? randRechts + 6 : 12)

    const posten = liste.map((m) => {
      const a = projiziere(m.x, 1.1, m.z)
      // Oben oder unten? Gegen die Gebaeudeachse an DERSELBEN Stelle pruefen,
      // nicht gegen die Bildmitte — der Riegel liegt schraeg im Bild. Die
      // gemessene Seite (nord/sued) hilft hier nicht: bei Blick von Sueden
      // liegt Nord oben, bei Blick von Norden unten. [uebersicht.html:661]
      const achse = projiziere(m.x, 1.1, szene.mitte.z)
      const s = m.saeule != null ? SAEULEN[m.saeule] : null
      return {
        m,
        a,
        oben: a.y < achse.y,
        name: m.hervor && s ? s.rolle.replace(/^(Der|Die|Das)\s+/, '') : m.text,
        zusatz: m.hervor && s ? `${s.n} · ${s.name}` : m.zusatz
      }
    })

    ctx.save()
    for (const richtung of ['oben', 'unten']) {
      const menge = posten.filter((o) => (richtung === 'oben' ? o.oben : !o.oben)).sort((p, q) => p.a.x - q.a.x)
      if (!menge.length) continue
      const reihen = []
      for (let i = 0; i < anzahl; i++) {
        reihen.push(
          richtung === 'oben'
            ? Math.max(weit ? 64 : 34, silhouette.y0 - BESCHRIFTUNG.abstandOben - i * abstand)
            : Math.min(hoehe - (weit ? 74 : 96), silhouette.y1 + BESCHRIFTUNG.abstandUnten + i * abstand)
        )
      }
      // Der Blattkopf sperrt links — aber nur, wenn die Etiketten wirklich auf
      // seiner Hoehe liegen, sonst zerrt es die Linien unnoetig in die Laenge.
      const minX = richtung === 'oben' && weit && Math.min(...reihen) < 118 ? 352 : 14
      const belegt = reihen.map(() => -1e9)

      for (const o of menge) {
        ctx.font = `500 ${fs}px ${SCHRIFT.serif}`
        const wName = ctx.measureText(o.name).width
        ctx.font = `${ss}px ${SCHRIFT.mono}`
        o.breite = Math.max(wName, o.zusatz ? ctx.measureText(o.zusatz).width : 0)
        const wunsch = Math.max(minX + o.breite / 2, Math.min(maxX - o.breite / 2, o.a.x))
        let reihe = 0
        let bestes = 1e9
        for (let i = 0; i < reihen.length; i++) {
          if (wunsch - o.breite / 2 >= belegt[i] + BESCHRIFTUNG.lueckeMin) {
            reihe = i
            bestes = 0
            break
          }
          const schub = belegt[i] + BESCHRIFTUNG.lueckeMin + o.breite / 2 - wunsch
          if (schub < bestes) {
            bestes = schub
            reihe = i
          }
        }
        const x = bestes === 0 ? wunsch : Math.min(maxX - o.breite / 2, wunsch + bestes)
        belegt[reihe] = x + o.breite / 2
        o.tx = x
        o.ty = reihen[reihe]
        o.linieY = richtung === 'oben' ? o.ty + (o.zusatz ? 16 : 6) : o.ty - 16
      }

      for (const o of menge) {
        const knick =
          richtung === 'oben'
            ? Math.min(o.a.y - 10, o.linieY + BESCHRIFTUNG.knickWeg)
            : Math.max(o.a.y + 10, o.linieY - BESCHRIFTUNG.knickWeg)
        ctx.beginPath()
        ctx.strokeStyle = o.m.hervor ? farben.akzent : farben.haar
        ctx.lineWidth = o.m.hervor ? 1.1 : 0.85
        ctx.globalAlpha = o.m.hervor ? 0.95 : 0.7
        ctx.moveTo(o.tx, o.linieY)
        ctx.lineTo(o.tx, knick)
        ctx.lineTo(o.a.x, o.a.y)
        ctx.stroke()
        ctx.beginPath()
        ctx.arc(o.a.x, o.a.y, o.m.hervor ? BESCHRIFTUNG.punktSaeule : BESCHRIFTUNG.punktNormal, 0, 7)
        ctx.fillStyle = o.m.hervor ? farben.akzent : farben.haar
        ctx.fill()
        ctx.globalAlpha = 1

        ctx.textAlign = 'center'
        ctx.textBaseline = 'alphabetic'
        ctx.font = `500 ${fs}px ${SCHRIFT.serif}`
        ctx.fillStyle = o.m.hervor ? farben.akzent : farben.tinte
        ctx.fillText(o.name, o.tx, o.ty)
        if (o.zusatz) {
          ctx.font = `${ss}px ${SCHRIFT.mono}`
          ctx.fillStyle = o.m.hervor ? farben.akzent : farben.tinteMatt
          ctx.globalAlpha = o.m.hervor ? 0.9 : 0.65
          ctx.fillText(o.zusatz, o.tx, o.ty + 12)
          ctx.globalAlpha = 1
        }
      }
    }
    ctx.restore()
  }

  /** Amber-Rahmen um die Boeden der Saeulen-Raeume.  [uebersicht.html:635] */
  function maleSaeulenRahmen() {
    const marken = szene.marken.filter((m) => m.hervor)
    if (!marken.length) return
    ctx.save()
    ctx.lineWidth = 1.8
    ctx.strokeStyle = farben.akzent
    ctx.globalAlpha = 0.85
    for (const m of marken) {
      const raum = szene.raeume.find(
        (r, i) => i !== szene.flurIndex && punktInRaum(m.x, m.z, r.punkte)
      )
      if (!raum) continue
      ctx.beginPath()
      raum.punkte.forEach((q, i) => {
        const p = projiziere(q.x, 0.12, q.z)
        if (i === 0) ctx.moveTo(p.x, p.y)
        else ctx.lineTo(p.x, p.y)
      })
      ctx.closePath()
      ctx.stroke()
    }
    ctx.restore()
  }

  function punktInRaum(x, z, punkte) {
    let drin = false
    for (let i = 0, j = punkte.length - 1; i < punkte.length; j = i++) {
      const a = punkte[i]
      const b = punkte[j]
      if (a.z > z !== b.z > z && x < ((b.x - a.x) * (z - a.z)) / (b.z - a.z) + a.x) drin = !drin
    }
    return drin
  }

  function zeichne() {
    setzeKamera()
    const richtung = kameraRichtung()

    const g = ctx.createLinearGradient(0, 0, 0, hoehe)
    g.addColorStop(0, farben.buehneOben)
    g.addColorStop(1, farben.buehneUnten)
    ctx.fillStyle = g
    ctx.fillRect(0, 0, breite, hoehe)

    // Boeden zuerst, in einem eigenen Durchgang. Sie sind grosse, teils
    // vielfach eingebuchtete Flaechen (die Erschliessung hat 46 Ecken) und
    // wuerden im gemeinsamen Tiefensortieren nach EINEM Mittelwert ganze
    // Moebelgruppen verdecken. Da sie flach am Boden liegen, kann nichts
    // hinter ihnen liegen — die Reihenfolge ist damit sachlich richtig.
    const unten = []
    for (const k of szene.boeden) flaechenVon(k, richtung, unten)
    unten.sort((a, b) => a.depth - b.depth)
    maleFlaechen(unten)

    const oben = []
    for (const k of szene.waende) flaechenVon(k, richtung, oben)
    if (!schnell) for (const k of szene.moebel) flaechenVon(k, richtung, oben)
    oben.sort((a, b) => a.depth - b.depth)
    maleFlaechen(oben)

    maleSaeulenRahmen()
    if (namenModus !== 'aus') maleNamen()
  }

  function passeAn() {
    const dpr = Math.min(globalThis.devicePixelRatio || 1, 2)
    const kasten = canvas.getBoundingClientRect()
    breite = Math.max(1, Math.round(kasten.width))
    hoehe = Math.max(1, Math.round(kasten.height))
    canvas.width = Math.round(breite * dpr)
    canvas.height = Math.round(hoehe * dpr)
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
    zeichne()
  }

  /* ── Bedienung: ziehen dreht, Rad zoomt, zwei Finger zoomen ─────── */
  let zieht = false
  let lx = 0
  let ly = 0
  let zeiger = new Map()
  let spanne = 0

  canvas.addEventListener('pointerdown', (e) => {
    zeiger.set(e.pointerId, [e.clientX, e.clientY])
    if (zeiger.size > 1) {
      zieht = false
      return
    }
    zieht = true
    schnell = true
    lx = e.clientX
    ly = e.clientY
    try {
      canvas.setPointerCapture(e.pointerId)
    } catch (_) {
      /* aelterer Browser: Zeiger bleibt ungebunden, Drehen geht trotzdem */
    }
  })

  canvas.addEventListener('pointermove', (e) => {
    if (zeiger.has(e.pointerId)) zeiger.set(e.pointerId, [e.clientX, e.clientY])
    if (zeiger.size === 2) {
      const v = [...zeiger.values()]
      const d = Math.hypot(v[0][0] - v[1][0], v[0][1] - v[1][1])
      if (spanne) {
        blick.zoom = Math.max(DARSTELLUNG.zoomMin, Math.min(DARSTELLUNG.zoomMax, blick.zoom * (d / spanne)))
        zeichne()
      }
      spanne = d
      return
    }
    if (!zieht) return
    const dx = e.clientX - lx
    const dy = e.clientY - ly
    lx = e.clientX
    ly = e.clientY
    if (e.shiftKey) {
      blick.schiebX += dx
      blick.schiebY += dy
    } else {
      blick.az -= dx * DARSTELLUNG.drehProPixel
      blick.el = Math.max(
        DARSTELLUNG.neigeMin,
        Math.min(DARSTELLUNG.neigeMax, blick.el + dy * DARSTELLUNG.neigeProPixel)
      )
    }
    zeichne()
  })

  const beenden = (e) => {
    zeiger.delete(e.pointerId)
    if (zeiger.size < 2) spanne = 0
    if (!zieht) return
    zieht = false
    schnell = false
    zeichne()
  }
  canvas.addEventListener('pointerup', beenden)
  canvas.addEventListener('pointercancel', beenden)

  canvas.addEventListener(
    'wheel',
    (e) => {
      e.preventDefault()
      const f = e.deltaY < 0 ? DARSTELLUNG.zoomSchritt : 1 / DARSTELLUNG.zoomSchritt
      blick.zoom = Math.max(DARSTELLUNG.zoomMin, Math.min(DARSTELLUNG.zoomMax, blick.zoom * f))
      zeichne()
    },
    { passive: false }
  )

  return {
    zeichne,
    passeAn,
    setzeBlick(az, el) {
      blick.az = az
      blick.el = el
      blick.zoom = 1
      blick.schiebX = 0
      blick.schiebY = 0
      zeichne()
    },
    setzeNamen(modus) {
      namenModus = modus
      zeichne()
    },
    setzeDunkel(an) {
      dunkel = an
      farben = an ? PALETTE.dunkel : PALETTE.hell
      zeichne()
    },
    setzeRandRechts(px) {
      randRechts = px
      zeichne()
    },
    get blick() {
      return { ...blick }
    }
  }
}

/* ══════════════════════════════════════════════════════════════════
   HUELLE
   ══════════════════════════════════════════════════════════════════ */
const cv = document.getElementById('c');
const tafel = document.getElementById('tafel');
let vollausbau = false, tafelAn = true, namenModus = 'alle', axo = null, szene = null;

function tafelRand(){ return (tafelAn && innerWidth > 900) ? 294 : 0; }

function bauen(){
  szene = baueSzene(PLAN, {
    wandDicke: 12.5,
    nurKernSaeulen: !vollausbau,
    hoehen: HOEHEN
  });
  axo = erzeugeAxonometrie(cv, szene, { namen: namenModus, randRechts: tafelRand() });
  axo.passeAn();
  tafelZeichnen();
}

function verortete(){
  const m = {};
  for (const k of szene.marken) if (k.hervor && k.saeule != null) m[k.saeule] = k.text;
  return m;
}

function tafelZeichnen(){
  const belegt = verortete();
  const anzahl = Object.keys(belegt).length;
  const leib = document.getElementById('tafelLeib');
  leib.innerHTML = '';
  SAEULEN.forEach(function(s, i){
    const raum = belegt[i];
    const el = document.createElement('div');
    el.className = 'zeile' + (raum ? ' an' : '');
    el.innerHTML = '<div class="n">' + s.n + '</div><div>' +
      '<div class="nm">' + s.rolle + '</div>' +
      (raum ? '<div class="rm">' + raum + '</div>' : '') +
      '<div class="src">' + s.name + '</div></div>';
    leib.appendChild(el);
  });
  document.getElementById('zaehler').textContent = anzahl + '/9 verortet';
  document.getElementById('tafelFuss').textContent = vollausbau
    ? 'Vollausbau — auch Teamtable, Konferenz, Workshop, Videokonf und Break out tragen eine Säule.'
    : 'Die vier Räume, die im Plan Workspace, Einzelbüro oder Doppelbüro heißen.';
  const b = (szene.grenzen.x1 - szene.grenzen.x0).toFixed(0);
  const t = (szene.grenzen.z1 - szene.grenzen.z0).toFixed(0);
  document.getElementById('unterzeile').innerHTML =
    'Axonometrie &middot; ' + b + ' &times; ' + t + ' m<br>' +
    anzahl + ' Räume nach den Säulen benannt';
}

function markiere(auswahl, wert){
  document.querySelectorAll(auswahl).forEach(function(b){
    const schluessel = Object.keys(b.dataset)[0];
    b.setAttribute('aria-pressed', String(b.dataset[schluessel] === wert));
  });
}

document.querySelectorAll('[data-blick]').forEach(function(b){
  b.addEventListener('click', function(){
    const v = BLICKE[+b.dataset.blick];
    axo.setzeBlick(v.az, v.el);
    markiere('[data-blick]', b.dataset.blick);
  });
});
document.querySelectorAll('[data-namen]').forEach(function(b){
  b.addEventListener('click', function(){
    namenModus = b.dataset.namen;
    axo.setzeNamen(namenModus);
    markiere('[data-namen]', namenModus);
  });
});
const btnAusbau = document.getElementById('btnAusbau');
btnAusbau.addEventListener('click', function(){
  vollausbau = !vollausbau;
  btnAusbau.setAttribute('aria-pressed', String(vollausbau));
  bauen();
});
const btnTafel = document.getElementById('btnTafel');
btnTafel.addEventListener('click', function(){
  tafelAn = !tafelAn;
  tafel.classList.toggle('weg', !tafelAn);
  btnTafel.setAttribute('aria-pressed', String(tafelAn));
  axo.setzeRandRechts(tafelRand());
});

cv.addEventListener('pointerdown', function(){ cv.classList.add('zieht'); });
['pointerup','pointercancel'].forEach(function(t){
  cv.addEventListener(t, function(){ cv.classList.remove('zieht'); });
});
addEventListener('resize', function(){ if (axo) axo.passeAn(); });

/* ── Start ──────────────────────────────────────────────────────────
   Auf schmalen Anzeigen laengs statt quer blicken: der 78-m-Riegel laeuft
   dann in die Tiefe statt ueber die Breite und wird gut doppelt so gross.
   Legende zu, nur die Saeulen beschriftet — sonst erschlaegt es das Bild. */
let startBlick = '0';
if (innerWidth < 900) {
  startBlick = '1';
  tafelAn = false;
  tafel.classList.add('weg');
  btnTafel.setAttribute('aria-pressed','false');
  namenModus = 'saeulen';
}
bauen();
if (startBlick === '1') axo.setzeBlick(BLICKE[1].az, 0.54);
markiere('[data-blick]', startBlick);
markiere('[data-namen]', namenModus);

/* ── Selbstauskunft fuer tools/pruefe-bank-ansicht.mjs ───────────────
   Das Pruefwerkzeug misst am fertigen Bild statt Behauptungen zu glauben.
   farbtoene() liest jetzt schlicht aus dem 2D-Canvas — der Umweg ueber
   gl.readPixels, den die frueher hier eingebettete WebGL-Fassung brauchte
   (ohne preserveDrawingBuffer ist ihr Zeichenpuffer nach dem Anzeigen leer),
   ist mit three.js entfallen. */
window.__modell = {
  wandZahl: PLAN.floorplan.walls.length,
  moebelZahl: (PLAN.floorplan.ausstattung || []).length,
  raumZahl: szene.raeume.length,
  breite: (szene.grenzen.x1 - szene.grenzen.x0) * 100,
  tiefe: (szene.grenzen.z1 - szene.grenzen.z0) * 100,
  blick: function(drehung, neigung){ axo.setzeBlick(drehung, neigung); },
  farbtoene: function(){
    const g = cv.getContext('2d');
    const d = g.getImageData(0, 0, cv.width, cv.height).data;
    const toene = new Set();
    for (let i = 0; i < d.length; i += 4 * 37) {
      toene.add((d[i] >> 4) + ',' + (d[i+1] >> 4) + ',' + (d[i+2] >> 4));
    }
    return toene.size;
  }
};
window.__bereit = true;
})();
